<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Registro usuario</h2>
        <form id="register-form">
            <div class="form-group">
                <label>Nombre completo *</label>
                <input type="text" id="name" placeholder="Nombres y apellidos" required>
            </div>
            <div class="form-group">
                <label>Nombre de usuario *</label>
                <input type="text" id="username" placeholder="nombre.usuario" required>
                <small>@ucatolica.edu.co</small>
            </div>
            <div class="form-group">
                <label>Departamento *</label>
                <select id="department" required>
                    <option value="">Departamento Residencia</option>
                </select>
            </div>
            <div class="form-group">
                <label>Ciudad *</label>
                <input type="text" id="city" placeholder="Ciudad de Residencia" required>
            </div>
            <div class="form-group">
                <label>País *</label>
                <select id="country" required>
                    <option value="">Seleccione País</option>
                </select>
                <img id="flag" class="flag" src="" alt="Bandera">
            </div>
            <div class="form-group">
                <label>Teléfono *</label>
                <input type="text" id="phone" placeholder="+57 3000000000" required>
            </div>
            <div class="form-group">
                <label>Contraseña *</label>
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>
            <p id="register-message" class="error-message"></p>
            <button type="submit" class="btn">Registrarse</button>
            <a href="index.html" class="link">Volver al inicio</a>
            <a href="login.html" class="link">¿Ya tienes cuenta? Iniciar sesión</a>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
